name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the retired "tools" package, which sdkmanager no longer has.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # Signs with your release key when the SIGNING_* secrets are set (see "Signing" in the README).
      # Without them (for example in forks) the APK is signed with a throwaway debug key.
      - name: Load release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key loaded."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: the APK will be signed with a debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: channelpulse
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ChannelPulse-apk
          path: app/build/outputs/apk/release/*.apk
